<meta name="description" content="潮汐手札 — 一款网页垂钓手札：抛竿、等口、提竿、控线，在三种水域收集二十四尾真实鱼种，遇见保护物种请放流。" />
<meta property="og:title" content="潮汐手札 · 网页垂钓" />
<meta property="og:description" content="抛竿、等口、提竿、控线。三种水域，二十四尾真实鱼种，一本可以慢慢写完的垂钓手札。" />
<meta property="og:type" content="website" />
<title>潮汐手札 · 网页垂钓</title>
<style>
/* ============ 设计令牌 ============ */
:root{
  --paper:#EDE3CF;
  --paper-hi:#F7F0E1;
  --paper-lo:#DED2B8;
  --ink:#16242B;
  --ink-soft:#4C5C61;
  --ink-faint:#7E8B8C;
  --verm:#BE4A2F;
  --verm-deep:#93331F;
  --sea:#2F6F73;
  --sea-deep:#1B474D;
  --gold:#A9803A;
  --line:rgba(22,36,43,.16);
  --line-strong:rgba(22,36,43,.34);
  --safe:#3F7F5C;
  --danger:#B03A25;
  --serif:"Songti SC","Noto Serif SC","STSong","SimSun",Georgia,"Times New Roman",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
  --r:3px;
  --shadow:0 1px 0 rgba(255,255,255,.7) inset,0 8px 24px -14px rgba(22,36,43,.45);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:
    radial-gradient(120% 90% at 12% 0%,#F4EBD8 0%,rgba(244,235,216,0) 60%),
    radial-gradient(90% 80% at 100% 100%,#E2D5B8 0%,rgba(226,213,184,0) 55%),
    var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
/* 纸张颗粒 */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.6;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='0.16'/></svg>");
  mix-blend-mode:multiply;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--sea);outline-offset:3px}

/* ============ 骨架 ============ */
#app{
  position:relative;z-index:1;
  max-width:1400px;margin:0 auto;
  padding:22px 26px 30px;
  display:grid;
  grid-template-columns:minmax(0,1fr) 340px;
  grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"mast mast" "stage side" "ctrl side";
  gap:14px 22px;
  min-height:100vh;
}

/* ============ 报头 ============ */
.masthead{grid-area:mast;display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;padding-bottom:10px;border-bottom:3px double var(--line-strong)}
.brand{display:flex;gap:13px;align-items:center}
.seal{
  width:46px;height:46px;flex:none;display:grid;place-items:center;
  background:var(--verm);color:#FBEFE3;font-family:var(--serif);font-size:25px;line-height:1;
  border-radius:2px;box-shadow:0 2px 0 rgba(0,0,0,.16),0 0 0 1px rgba(147,51,31,.5);
  transform:rotate(-1.5deg);
  letter-spacing:0;
}
.brand h1{font-family:var(--serif);font-size:27px;line-height:1.05;letter-spacing:.13em;font-weight:700}
.brand p{font-size:11px;letter-spacing:.22em;color:var(--ink-faint);text-transform:uppercase;margin-top:4px}
.hud{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hud-item{
  display:flex;flex-direction:column;gap:1px;padding:4px 11px 4px 12px;
  border-left:1px solid var(--line);min-width:66px;
}
.hud-item .k{font-size:9.5px;letter-spacing:.2em;color:var(--ink-faint)}
.hud-item .v{font-family:var(--mono);font-size:16px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hud-item.coin .v{color:var(--gold)}
.icon-btn{
  width:31px;height:31px;display:grid;place-items:center;border:1px solid var(--line-strong);
  border-radius:50%;font-size:13px;color:var(--ink-soft);transition:.16s;background:rgba(255,255,255,.25)
}
.icon-btn:hover{background:var(--ink);color:var(--paper-hi);border-color:var(--ink)}
.icon-btn.off{opacity:.4}

/* ============ 舞台 ============ */
.stage-wrap{grid-area:stage;display:flex;flex-direction:column;gap:12px;min-width:0}
.stage{
  position:relative;width:100%;aspect-ratio:16/9;min-height:280px;
  background:var(--sea-deep);border:1px solid var(--line-strong);border-radius:2px;
  box-shadow:0 0 0 5px rgba(255,255,255,.34),0 0 0 6px var(--line),0 14px 30px -18px rgba(22,36,43,.6);
  overflow:hidden;touch-action:none;cursor:crosshair;
  transition:box-shadow .3s;
}
.stage.charging{cursor:grabbing}
canvas#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:1;opacity:.4;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23g)' opacity='0.22'/></svg>");
}

/* 舞台内浮层 */
.overlay{position:absolute;inset:0;pointer-events:none;z-index:2}
.water-tag{
  position:absolute;top:12px;left:14px;display:flex;gap:8px;align-items:center;
  font-size:10.5px;letter-spacing:.18em;color:rgba(247,240,225,.9);
  background:rgba(18,38,42,.42);padding:4px 10px;border:1px solid rgba(247,240,225,.22);
  border-radius:2px;backdrop-filter:blur(3px);text-transform:uppercase
}
.water-tag b{font-weight:600;letter-spacing:.1em}
.water-tag i{width:1px;height:10px;background:rgba(247,240,225,.3)}

.prompt{
  position:absolute;left:50%;bottom:78px;transform:translateX(-50%);
  font-family:var(--serif);font-size:16px;letter-spacing:.12em;color:#FBEFE3;
  background:rgba(18,38,42,.5);padding:6px 16px;border-radius:2px;
  border:1px solid rgba(247,240,225,.24);
  opacity:0;transition:opacity .24s,transform .24s;white-space:nowrap;
  text-shadow:0 1px 2px rgba(0,0,0,.4);backdrop-filter:blur(3px)
}
.prompt.show{opacity:1;transform:translateX(-50%) translateY(-3px)}
.prompt.alert{background:rgba(147,51,31,.72);border-color:rgba(251,239,227,.5);animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{box-shadow:0 0 0 6px rgba(190,74,47,.24)}}

/* 蓄力条 */
.cast-bar{
  position:absolute;left:26px;right:26px;bottom:22px;height:20px;opacity:0;transition:opacity .18s;
  display:flex;align-items:center;gap:10px
}
.cast-bar.show{opacity:1}
.cast-bar .track{
  position:relative;flex:1;height:9px;background:rgba(18,38,42,.55);border:1px solid rgba(247,240,225,.35);
  border-radius:1px;overflow:hidden
}
.cast-bar .fill{position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(90deg,#E4C98A,#BE4A2F);transition:none;z-index:1}
.cast-bar .sweet{position:absolute;top:0;bottom:0;width:12%;background:rgba(251,239,227,.22);border-left:1px dashed rgba(251,239,227,.85);border-right:1px dashed rgba(251,239,227,.85);z-index:2}
.cast-bar .lbl{font-family:var(--mono);font-size:11px;color:#FBEFE3;min-width:44px;text-align:right;letter-spacing:.04em}

/* 角力 HUD */
.fight{
  position:absolute;inset:0;opacity:0;transition:opacity .22s;pointer-events:none;
  background:radial-gradient(120% 100% at 50% 120%,rgba(10,22,26,.5),rgba(10,22,26,0) 62%)
}
.fight.show{opacity:1}
.tension{
  position:absolute;right:18px;top:50%;transform:translateY(-50%);
  width:26px;height:62%;overflow:visible
}
.tension .bar{
  position:relative;width:100%;height:100%;background:rgba(12,26,30,.62);
  border:1px solid rgba(247,240,225,.4);border-radius:1px;overflow:hidden
}
.tension .zone{position:absolute;left:0;right:0;z-index:2;background:rgba(94,168,124,.14);border-top:2px solid rgba(196,236,210,.9);border-bottom:2px solid rgba(196,236,210,.9)}
.tension .mark{position:absolute;left:0;right:0;bottom:0;z-index:1;background:linear-gradient(0deg,rgba(228,201,138,.92),rgba(190,74,47,.92));transition:height .06s linear}
.tension .cap{
  position:absolute;left:50%;top:-34px;transform:translateX(-50%);
  font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:rgba(247,240,225,.95);
  white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.5)
}
.tension .cap b{display:block;font-family:var(--sans);font-size:8px;letter-spacing:.18em;opacity:.6;font-weight:400}
.stamina{
  position:absolute;left:50%;bottom:26px;transform:translateX(-50%);width:min(62%,380px);
  display:flex;flex-direction:column;gap:5px;align-items:center
}
.stamina .track{width:100%;height:8px;background:rgba(12,26,30,.62);border:1px solid rgba(247,240,225,.4);overflow:hidden;border-radius:1px}
.stamina .fill{height:100%;width:0%;background:#E9DEC5;transition:width .08s linear;box-shadow:0 0 8px rgba(233,222,197,.4)}
.stamina .cap{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:rgba(247,240,225,.9);text-shadow:0 1px 2px rgba(0,0,0,.5)}

.catch-flash{position:absolute;inset:0;background:#F7F0E1;opacity:0;pointer-events:none;mix-blend-mode:screen}
.catch-flash.on{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.75}100%{opacity:0}}

/* ============ 控制台 ============ */
.controls{
  grid-area:ctrl;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:stretch;
  background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.16));
  border:1px solid var(--line);border-radius:2px;padding:10px 12px;box-shadow:var(--shadow)
}
.pickers{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;min-width:0}
.picker{display:flex;flex-direction:column;gap:4px;min-width:0}
.picker > .plabel{font-size:9.5px;letter-spacing:.2em;color:var(--ink-faint)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{
  font-size:12px;padding:3px 9px;border:1px solid var(--line-strong);border-radius:2px;
  color:var(--ink-soft);background:rgba(255,255,255,.24);transition:.15s;white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px
}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper-hi)}
.chip.locked{opacity:.55;cursor:not-allowed;border-style:dashed}
.chip small{font-family:var(--mono);font-size:10px;opacity:.7}
.chip.on small{opacity:.8}

.action-zone{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:190px}
.btn-action{
  position:relative;width:100%;min-width:180px;padding:13px 22px;border-radius:2px;
  background:var(--verm);color:#FBEFE3;font-family:var(--serif);font-size:17px;letter-spacing:.24em;
  border:1px solid var(--verm-deep);
  box-shadow:0 2px 0 var(--verm-deep),0 8px 18px -10px rgba(147,51,31,.8);
  transition:transform .1s,box-shadow .1s,background .2s;user-select:none;touch-action:none;
  display:flex;align-items:center;justify-content:center;gap:9px
}
.btn-action:hover{background:#C85436}
.btn-action:active,.btn-action.down{transform:translateY(2px);box-shadow:0 0 0 var(--verm-deep),0 4px 10px -8px rgba(147,51,31,.9)}
.btn-action[disabled]{background:var(--paper-lo);color:var(--ink-faint);border-color:var(--line-strong);box-shadow:none;cursor:not-allowed}
.btn-action .sub{font-family:var(--sans);font-size:10px;letter-spacing:.1em;opacity:.72}
.hint{font-size:11px;color:var(--ink-faint);text-align:center;min-height:16px;letter-spacing:.02em}
.hint b{color:var(--verm);font-weight:600}

/* ============ 侧栏 ============ */
.sidebar{
  grid-area:side;display:flex;flex-direction:column;min-height:0;
  border:1px solid var(--line-strong);border-radius:2px;background:rgba(255,255,255,.34);
  box-shadow:var(--shadow);overflow:hidden
}
.tabs{display:flex;border-bottom:1px solid var(--line-strong);flex:none}
.tab{
  flex:1;padding:9px 4px;font-size:12px;letter-spacing:.16em;color:var(--ink-faint);
  border-right:1px solid var(--line);transition:.15s;position:relative
}
.tab:last-child{border-right:0}
.tab:hover{color:var(--ink);background:rgba(255,255,255,.4)}
.tab.on{color:var(--ink);font-weight:600;background:rgba(255,255,255,.62)}
.tab.on::after{content:"";position:absolute;left:18%;right:18%;bottom:-1px;height:2px;background:var(--verm)}
.panel{display:none;padding:13px 14px 16px;overflow-y:auto;min-height:0;flex:1}
.panel.on{display:block}
.panel::-webkit-scrollbar{width:6px}
.panel::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px}

.dex-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.dex-head h2{font-family:var(--serif);font-size:15px;letter-spacing:.1em}
.dex-head span{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
.dex-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.dex-card{
  border:1px solid var(--line);border-radius:2px;padding:7px 8px;background:rgba(255,255,255,.32);
  position:relative;transition:.16s;min-height:74px;display:flex;flex-direction:column;justify-content:space-between
}
.dex-card:hover{background:rgba(255,255,255,.6);border-color:var(--line-strong)}
.dex-card .no{font-family:var(--mono);font-size:9px;color:var(--ink-faint);letter-spacing:.06em}
.dex-card .nm{font-family:var(--serif);font-size:13.5px;line-height:1.2;margin-top:1px;letter-spacing:.04em}
.dex-card .meta{font-size:9.5px;color:var(--ink-faint);display:flex;justify-content:space-between;gap:4px;margin-top:4px}
.dex-card.unknown{background:repeating-linear-gradient(135deg,rgba(22,36,43,.035) 0 4px,transparent 4px 8px)}
.dex-card.unknown .nm{color:var(--ink-faint);letter-spacing:.2em}
.dex-card .rarity-dot{position:absolute;right:7px;top:7px;width:6px;height:6px;border-radius:50%}
.dex-card.protect{border-color:rgba(190,74,47,.5);background:rgba(190,74,47,.06)}
.dex-card.protect::after{content:"护";position:absolute;right:6px;top:5px;font-size:9px;color:var(--verm);font-size:10px}
.dex-note{font-size:10.5px;color:var(--ink-faint);line-height:1.6;margin-top:11px;padding-top:9px;border-top:1px dotted var(--line-strong)}
.dex-note b{color:var(--verm-deep)}

.equip-row{border-bottom:1px dotted var(--line-strong);padding:10px 0;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.equip-row:last-of-type{border-bottom:0}
.equip-info{min-width:0}
.equip-info h3{font-size:12.5px;font-weight:600;letter-spacing:.06em;display:flex;gap:6px;align-items:baseline}
.equip-info h3 em{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--ink-faint);letter-spacing:0}
.equip-info p{font-size:10.5px;color:var(--ink-faint);line-height:1.5;margin-top:2px}
.equip-lv{display:flex;gap:3px;margin-top:5px}
.equip-lv i{width:14px;height:3px;background:var(--line-strong);border-radius:1px}
.equip-lv i.on{background:var(--sea)}
.btn-buy{
  flex:none;font-size:11px;padding:5px 11px;border:1px solid var(--line-strong);border-radius:2px;
  background:rgba(255,255,255,.4);transition:.15s;white-space:nowrap;font-family:var(--mono)
}
.btn-buy:hover:not([disabled]){background:var(--ink);color:var(--paper-hi);border-color:var(--ink)}
.btn-buy[disabled]{opacity:.42;cursor:not-allowed}
.btn-buy.max{opacity:.6;cursor:default}
.section-title{font-family:var(--serif);font-size:13px;letter-spacing:.14em;margin:4px 0 2px;color:var(--ink)}
.section-title:not(:first-child){margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}

.guide{font-size:12px;line-height:1.72;color:var(--ink-soft)}
.guide h3{font-family:var(--serif);font-size:14px;letter-spacing:.1em;color:var(--ink);margin:14px 0 6px}
.guide h3:first-child{margin-top:0}
.guide ol,.guide ul{padding-left:17px;display:flex;flex-direction:column;gap:5px}
.guide li::marker{color:var(--verm);font-family:var(--mono);font-size:11px}
.guide ul + p,.guide ol + p{margin-top:8px}
.guide b{color:var(--ink);font-weight:600}
.guide .kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:2px;padding:0 4px;background:rgba(255,255,255,.5)}
.guide .quote{
  border-left:2px solid var(--verm);padding:4px 0 4px 10px;margin:9px 0;font-family:var(--serif);
  font-size:12px;color:var(--ink-soft);letter-spacing:.03em;line-height:1.7
}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.stat{padding:6px 9px;border:1px solid var(--line);background:rgba(255,255,255,.28)}
.stat b{display:block;font-family:var(--mono);font-size:15px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:9px;letter-spacing:.16em;color:var(--ink-faint)}
.stat.wide{grid-column:span 2}
.btn-reset{
  width:100%;margin-top:14px;padding:8px;border:1px dashed var(--line-strong);border-radius:2px;
  font-size:11px;letter-spacing:.12em;color:var(--ink-faint);background:rgba(255,255,255,.2);transition:.15s
}
.btn-reset:hover{color:var(--verm);border-color:var(--verm);background:rgba(190,74,47,.05)}
.btn-reset.armed{color:var(--verm);border-color:var(--verm);background:rgba(190,74,47,.08)}
.guide .src{font-size:10px;color:var(--ink-faint);line-height:1.6;margin-top:12px;padding-top:8px;border-top:1px dotted var(--line-strong)}

/* ============ 渔获卡 ============ */
.modal{
  position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;
  background:rgba(14,28,32,.5);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .22s
}
.modal.show{opacity:1;pointer-events:auto}
.card{
  position:relative;width:min(420px,100%);background:var(--paper-hi);
  border:1px solid var(--line-strong);box-shadow:0 30px 60px -30px rgba(0,0,0,.7),0 0 0 6px rgba(247,240,225,.14);
  padding:22px 22px 18px;transform:translateY(14px) scale(.985);transition:transform .3s cubic-bezier(.2,.8,.2,1)
}
.modal.show .card{transform:none}
.card::before{content:"";position:absolute;inset:6px;border:1px solid var(--line);pointer-events:none}
.card .stamp{
  position:absolute;right:16px;top:14px;width:62px;height:62px;border:2px solid var(--verm);border-radius:50%;
  color:var(--verm);display:grid;place-items:center;font-family:var(--serif);font-size:15px;letter-spacing:.04em;
  transform:rotate(-9deg);opacity:.86;text-align:center;line-height:1.1;padding:4px;mix-blend-mode:multiply
}
.card-kicker{font-size:9.5px;letter-spacing:.28em;color:var(--ink-faint);text-transform:uppercase}
.card h2{font-family:var(--serif);font-size:30px;letter-spacing:.08em;line-height:1.15;margin:3px 0 2px;padding-right:64px}
.card .latin{font-family:var(--serif);font-style:italic;font-size:12px;color:var(--ink-faint);letter-spacing:.02em}
.card .rule{height:1px;background:var(--line-strong);margin:13px 0}
.card-art{
  position:relative;height:126px;margin:10px 0 4px;display:grid;place-items:center;
  background:linear-gradient(180deg,rgba(47,111,115,.07),rgba(47,111,115,.01));
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden
}
